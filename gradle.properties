# Keep enough heap for release builds without allowing Gradle and Kotlin
# daemons to exhaust a typical development machine when the IDE is open.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
org.gradle.daemon.idletimeout=900000
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
kotlin.caching.enabled=true
